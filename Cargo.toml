[package]
name = "kairo-plugin-sources"
version = "1.0.0"
edition = "2024"
publish = false
autotests = false

[lib]
crate-type = ["cdylib"]

[lints.rust]
unsafe_code = "forbid"

# Standalone repository, checked out at `plugins/sources` in a Kairo checkout.
[workspace]

[dependencies]
abi_stable = { version = "0.11", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
des = { version = "0.8", default-features = false }
kairo-plugin-api = { path = "../../crates/kairo-plugin-api" }
regex = { version = "1", default-features = false, features = ["std", "perf"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
